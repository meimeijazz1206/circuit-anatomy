<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賽道解剖 — 2026 賽季</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#FF2B12; --yellow:#FFD60A; --ink:#0D0D0D; --white:#FFFFFF; --grey:#6B6B6B;
    --display:"Anton",Impact,sans-serif;
    --sans:"Noto Sans TC","Hiragino Sans",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* ---------- 封面 ---------- */
  .hero{position:relative;background:var(--red);min-height:100vh;overflow:hidden;
        padding:26px 4vw 0;display:flex;flex-direction:column}
  /* 斜向速度線 */
  .hero::before{content:"";position:absolute;inset:-30%;
    background:repeating-linear-gradient(-62deg,transparent 0 46px,rgba(0,0,0,.075) 46px 49px);
    pointer-events:none}
  .bar{position:relative;z-index:3;display:flex;justify-content:space-between;
       font-family:var(--display);font-size:15px;letter-spacing:.08em}
  .bar b{background:var(--ink);color:var(--red);padding:3px 9px;font-weight:400}

  .title{position:relative;z-index:3;margin-top:2vh;font-weight:900;
         font-size:clamp(72px,min(13vw,19vh),230px);line-height:.84;letter-spacing:-.05em;
         transform:skewX(-9deg);transform-origin:left bottom}
  .title span{display:block}
  .title .w{color:var(--white)}

  .ghost{position:absolute;z-index:2;right:-4vw;top:5vh;width:min(58vw,96vh);max-width:980px;
         transform:rotate(-9deg)}
  .ghost path{fill:none;stroke:var(--white);stroke-width:3.4;stroke-linejoin:round}
  .ghost circle{fill:var(--yellow);stroke:var(--ink);stroke-width:1}

  .season{position:absolute;z-index:1;right:3vw;bottom:9vh;font-family:var(--display);
          font-size:clamp(90px,19vw,300px);line-height:.8;color:transparent;
          -webkit-text-stroke:2px rgba(13,13,13,.55)}

  /* 主打賽道：跟背景輪廓同一條 */
  .feat{position:relative;z-index:4;display:grid;grid-template-columns:minmax(0,400px) auto;
        column-gap:30px;align-items:end;max-width:640px;margin-top:3vh;color:var(--ink)}
  .feat>*{grid-column:1}
  .feat ul{grid-column:2;grid-row:1 / span 4}
  .feat small{font-family:var(--display);letter-spacing:.18em;font-size:13px}
  .feat h3{font-family:var(--display);font-weight:400;font-size:clamp(38px,min(4.2vw,6.4vh),62px);
           line-height:1;margin-top:6px;color:var(--white)}
  /* Anton 沒有中文字；中文站名改用粗黑體，不然會掉成細字 */
  .feat h3.cjk{font-family:var(--sans);font-weight:900;letter-spacing:-.02em}
  .feat h3 em{display:block;font-family:var(--sans);font-style:normal;font-weight:900;
              font-size:20px;color:var(--ink);margin-top:8px;letter-spacing:.02em}
  .feat p{font-size:14.5px;line-height:1.7;font-weight:500;margin-top:10px}
  .feat ul{list-style:none;display:flex;flex-direction:column;gap:10px;
           padding-left:22px;border-left:3px solid var(--ink)}
  .feat li b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(30px,4.4vh,40px);line-height:1}
  .feat li sup{font-size:13px;margin-left:2px;vertical-align:top;position:relative;top:4px}
  .feat li span{font-size:12px;font-weight:700;white-space:nowrap}
  .feat i{display:inline-block;font-style:normal;margin-top:12px;font-family:var(--display);
          letter-spacing:.16em;font-size:14px;border-bottom:3px solid var(--ink);padding-bottom:2px}
  .feat:hover i{color:var(--white);border-color:var(--white)}

  /* 底部一列：下一站貼紙＋倒數 */
  .bottom{position:relative;z-index:4;display:flex;align-items:flex-end;gap:5vw;flex-wrap:wrap;
          margin:auto 0 5vh;padding-top:3vh}
  .count small{display:block;font-family:var(--display);letter-spacing:.18em;font-size:13px;
               margin-bottom:10px}
  .digits{display:flex;gap:10px}
  .dg{background:var(--ink);padding:10px 14px 8px;min-width:98px;text-align:center;
      transform:skewX(-9deg)}
  .dg b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(42px,min(5vw,8vh),76px);
        line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums;transform:skewX(9deg)}
  .dg span{display:block;font-family:var(--display);letter-spacing:.2em;font-size:11px;
           color:var(--white);margin-top:4px;transform:skewX(9deg)}
  .dg:last-child b{color:var(--white)}

  .sticker{position:relative;z-index:4;align-self:flex-end;
           background:var(--ink);color:var(--yellow);padding:16px 22px 18px;
           transform:rotate(-3deg);box-shadow:10px 10px 0 var(--yellow)}
  .sticker small{display:block;font-family:var(--display);letter-spacing:.2em;
                 font-size:13px;color:var(--white)}
  .sticker strong{display:block;font-family:var(--display);font-weight:400;
                  font-size:clamp(38px,min(5vw,8vh),78px);line-height:1;margin-top:6px}
  .sticker span{display:block;font-size:14px;font-weight:700;color:var(--white);margin-top:6px}
  .sticker em{display:inline-block;font-style:normal;margin-top:10px;font-family:var(--display);
              letter-spacing:.14em;font-size:13px;background:var(--red);color:var(--ink);
              padding:3px 8px}

  .checker{position:relative;z-index:4;height:26px;margin:0 -4vw;
    background:conic-gradient(var(--ink) 25%,var(--white) 0 50%,var(--ink) 0 75%,var(--white) 0)
               0 0/26px 26px}

  /* ---------- 賽程：兩欄、限寬，約一屏看完 ---------- */
  .cal{padding:10vh 4vw 11vh;color:var(--white)}
  .wrap{max-width:1280px;margin:0 auto}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex-wrap:wrap;
        padding-bottom:18px;border-bottom:3px solid currentColor}
  .head h2{font-family:var(--display);font-weight:400;font-size:clamp(44px,5vw,76px);line-height:.92}
  .head p{font-size:14px;font-weight:700;line-height:1.7;max-width:30em}
  .cal h2{color:var(--yellow)}
  .cal .head{border-color:var(--white)}
  .cal .head p{color:#D6D6D6}

  .rows{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(12,auto);
        grid-auto-flow:column;column-gap:48px}
  .row{display:grid;grid-template-columns:48px minmax(0,1fr) 58px 96px;align-items:center;gap:14px;
       height:58px;padding:0 12px;border-bottom:1px solid #2A2A2A;position:relative}
  .row .no{font-family:var(--display);font-size:30px;line-height:1;color:transparent;
           -webkit-text-stroke:1.2px var(--yellow)}
  .row .nm{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
  .row .nm b{font-family:var(--display);font-weight:400;font-size:23px;letter-spacing:.02em}
  .row .nm i{font-style:normal;font-size:13px;font-weight:700;color:#BDBDBD}
  .row .ci,.row .th{display:none}
  .row .dt{font-family:var(--display);font-size:16px;letter-spacing:.06em;color:#BDBDBD}
  .row .go{justify-self:end;font-family:var(--display);letter-spacing:.12em;font-size:13px}

  /* 已跑完：退到背景，但冠軍看得到 */
  .row.done .no{-webkit-text-stroke-color:#555}
  .row.done .nm b,.row.done .dt{color:#6E6E6E}
  .row.done .nm i{color:#5A5A5A}
  .row.done .go{color:var(--yellow)}

  /* 已建好的賽道：整列黃底 */
  .row.live{background:var(--yellow);color:var(--ink);border-bottom-color:var(--ink);
            transition:background .15s}
  .row.live .no{color:var(--ink);-webkit-text-stroke:0}
  .row.live .nm b,.row.live .nm i,.row.live .dt{color:var(--ink)}
  .row.live .go{background:var(--ink);color:var(--yellow);padding:6px 10px}
  .row.live:hover{background:var(--red)}
  .row.live:hover .go{color:var(--red)}

  /* 下一站 */
  .row.next{background:rgba(255,43,18,.16);box-shadow:inset 4px 0 0 var(--red)}
  .row.next .go{background:var(--red);color:var(--ink);padding:5px 9px;
                animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:.3}}
  /* 下一站同時是已建好的賽道：維持黃底，只加紅色側邊條 */
  .row.live.next{background:var(--yellow);box-shadow:inset 6px 0 0 var(--red)}
  .row.live.next .go{background:var(--red);color:var(--white);animation:none}
  .row.live.next:hover{background:var(--red)}
  .row.live.next:hover .go{background:var(--ink);color:var(--red)}
  /* 已跑完、賽道還沒建好：淺底深字，不要整塊黑 */
  .row.pend{background:#E9E6DC;color:var(--ink);border-bottom-color:var(--ink)}
  .row.pend .no{-webkit-text-stroke-color:var(--ink)}
  .row.pend .nm b,.row.pend .nm i,.row.pend .dt{color:var(--ink)}
  .row.pend .go{color:var(--ink);font-size:12px}

  /* ---------- 積分榜 ---------- */
  .std{background:var(--ink);color:var(--white);padding:10vh 4vw 11vh}
  .std h2{color:var(--yellow)}
  .std .head{border-color:var(--white)}
  .std .head p{color:#D6D6D6}
  .tabs{display:flex;gap:10px;margin-top:26px}
  .tabs button{font-family:var(--display);letter-spacing:.14em;font-size:15px;padding:9px 18px;cursor:pointer;
    background:transparent;color:var(--white);border:2px solid var(--white)}
  .tabs button[aria-selected=true]{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
  .tbl{margin-top:18px;background:var(--white);color:var(--ink);border:3px solid var(--yellow);list-style:none;
       display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;
       grid-template-rows:repeat(var(--rows),auto)}
  .tbl li{display:grid;grid-template-columns:34px 46px 30px minmax(0,1fr) auto;align-items:center;gap:10px;
          padding:9px 14px;border-bottom:1px solid #E4E4E4}
  .tbl.teams li{grid-template-columns:34px 30px minmax(0,1fr) auto}
  .tbl li:nth-child(n){border-right:0}
  .mk{width:30px;height:30px;display:grid;place-items:center;font-family:var(--display);font-size:11px;
      letter-spacing:.02em;line-height:1;border-radius:4px;border:2px solid var(--ink)}
  .tbl .ps{font-family:var(--display);font-size:18px;color:#777}
  .tbl .no{font-family:var(--display);font-size:22px;line-height:1;color:var(--ink)}
  .tbl .no::before{content:"#";font-size:13px;color:#777;margin-right:1px}
  .tbl .who{font-size:14px;font-weight:700;line-height:1.3}
  .tbl .who i{display:block;font-style:normal;font-weight:500;font-size:12px;color:#5A5A5A}
  .tbl .pt{font-family:var(--display);font-size:24px;text-align:right}
  .tbl .pt small{font-size:11px;letter-spacing:.1em;color:#777;margin-left:3px}
  .tbl li.lead{background:var(--red);color:var(--white)}
  .tbl li.lead .ps,.tbl li.lead .no,.tbl li.lead .who i,.tbl li.lead .pt small,.tbl li.lead .no::before{color:rgba(255,255,255,.9)}
  .card li b small{font-size:13px;color:#777;margin-left:4px;letter-spacing:0}
  .card li.p1 b small{color:rgba(255,255,255,.88)}
  @media(max-width:860px){.tbl{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}}

  /* ---------- 名次：黃底白卡，閱讀區一律白底黑字 ---------- */
  .res{background:var(--yellow);color:var(--ink);padding:10vh 4vw 12vh;position:relative}
  .res::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;
    background:conic-gradient(var(--ink) 25%,var(--white) 0 50%,var(--ink) 0 75%,var(--white) 0)
               0 0/22px 22px}
  .res .head p{color:var(--ink)}
  .cards{margin-top:30px;display:grid;gap:20px;align-items:start;
         grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .card{background:var(--white);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
        display:flex;flex-direction:column}
  .card.has{box-shadow:6px 6px 0 var(--red)}
  .card header{display:flex;gap:10px;align-items:baseline;background:var(--ink);color:var(--white);
               padding:10px 14px;font-family:var(--display);letter-spacing:.06em;font-size:17px}
  .card header .n{color:var(--yellow)}
  .card header .d{margin-left:auto;color:#BDBDBD;font-size:14px}
  .card ol{list-style:none}
  .card li{display:grid;grid-template-columns:32px 92px 1fr;align-items:center;gap:8px;
           padding:9px 14px;border-top:1px solid #E4E4E4}
  .card li:first-child{border-top:0}
  .card .pos{font-family:var(--display);font-size:14px;color:#777}
  .card li b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
  .card .who{font-size:13.5px;font-weight:700;line-height:1.35}
  .card .who i{display:block;font-style:normal;font-weight:500;font-size:12px;color:#5A5A5A}
  /* 冠軍：紅底白字 */
  .card li.p1{background:var(--red);color:var(--white);border:0}
  .card li.p1 .pos,.card li.p1 .who i{color:rgba(255,255,255,.88)}
  .card details{padding:0 14px 12px;border-top:1px solid #E4E4E4}
  .card summary{cursor:pointer;font-family:var(--display);letter-spacing:.14em;font-size:13px;
                color:var(--ink);list-style:none;padding:10px 0 2px}
  .card summary::-webkit-details-marker{display:none}
  .card summary::before{content:"+ "}
  .card details[open] summary::before{content:"− "}
  .card table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px;color:#1E1E1E}
  .card td{padding:6px 4px;border-top:1px solid #EDEDED;vertical-align:baseline}
  .card td:first-child{font-family:var(--display);color:#777;width:34px}
  .card td b{font-family:var(--display);font-weight:400;font-size:15px;margin-right:4px}
  .card td:nth-child(3){color:#5A5A5A;font-size:12px}
  .card td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:#5A5A5A;font-size:12px}
  .card .lk{margin-top:auto;display:block;background:var(--ink);color:var(--yellow);
            padding:10px 14px;font-family:var(--display);letter-spacing:.14em;font-size:13px}
  .card .lk:hover{background:var(--red);color:var(--white)}

  footer{padding:0 4vw 40px;color:#666;font-size:11px;line-height:1.7}

  @media(max-width:860px){
    .feat{grid-template-columns:1fr}
    .feat ul{grid-column:1;grid-row:auto;flex-direction:row;border-left:0;padding-left:0;
             border-top:3px solid var(--ink);padding-top:10px;margin-top:12px;gap:22px}
    .rows{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}
    .row{grid-template-columns:40px minmax(0,1fr) 84px;gap:10px}
    .row .dt{display:none}
    .ghost{width:110vw;top:24vh;opacity:.6}
  }
</style>
</head>
<body>
<section class="hero">
  <div class="bar"><span>CIRCUIT ANATOMY</span><b id="bar-r">23 ROUNDS</b></div>
  <h1 class="title"><span>賽道</span><span class="w">解剖</span></h1>
  <svg class="ghost" id="ghost" viewBox="0 0 100 100"></svg>
  <div class="season">2026</div>
  <a class="feat" id="feat"></a>
  <div class="bottom">
    <a class="sticker" id="sticker"></a>
    <div class="count">
      <small>LIGHTS OUT IN ・ 距離下一站開賽</small>
      <div class="digits" id="digits"></div>
    </div>
  </div>
  <div class="checker"></div>
</section>

<section class="cal"><div class="wrap">
  <div class="head">
    <h2>2026 CALENDAR</h2>
    <p>23 站全部在這裡。黃色的是已經拆解完、可以進去看的賽道；跑完的站直接顯示冠軍。</p>
  </div>
  <div class="rows" id="rows"></div>
</div></section>

<section class="std"><div class="wrap">
  <div class="head">
    <h2>STANDINGS</h2>
    <p id="std-sub"></p>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-d" aria-selected="true">DRIVERS 車手</button>
    <button role="tab" id="t-t" aria-selected="false">TEAMS 車隊</button>
  </div>
  <ol class="tbl" id="tbl"></ol>
</div></section>

<section class="res"><div class="wrap">
  <div class="head">
    <h2>RESULTS</h2>
    <p id="res-sub"></p>
  </div>
  <div class="cards" id="cards"></div>
</div></section>

<footer>賽程來源 formula1.com；名次來源 Jolpica F1 API。賽道輪廓取自 OpenStreetMap。本站不使用任何賽事或車隊的商標，也不使用車手肖像。</footer>

<script type="module">
import { rounds, built, next, doneCount, OUTLINES, METAS, LEDE, STATS, startPoint, countdown }
  from './season.js';
import { RESULTS, UPDATED } from './tracks/results.js';
import { STANDINGS } from './tracks/standings.js';

document.getElementById('bar-r').textContent = `${doneCount} / 23 FINISHED`;

// 封面的大輪廓：最近一條建好的賽道
// 封面主打：下一站建好了就放下一站；還沒建，就放最近跑完的那一條建好的賽道
const hero = next.live ? next : (built.filter(b => b.done).at(-1) || built[0]);
const [sx, sy] = startPoint(OUTLINES[hero.track]);
document.getElementById('ghost').innerHTML =
  `<path d="${OUTLINES[hero.track]}"/><circle cx="${sx}" cy="${sy}" r="1.8"/>`;

// 封面主打：文字要跟背景那條輪廓是同一條賽道
const hm = METAS[hero.track];
const feat = document.getElementById('feat');
feat.href = `./${hero.track}.html`;
feat.innerHTML = `<small>FEATURED ・ R${hero.no} ${hero.en}</small>
  <h3${/[\u3400-\u9fff]/.test(hm.title) ? ' class="cjk"' : ''}>${hm.title.toUpperCase()}<em>${hm.tagline}</em></h3>
  <p>${LEDE[hero.track]}</p>
  <ul>${STATS[hero.track].map(([v, u, k]) =>
    `<li><b>${v}<sup>${u}</sup></b><span>${k}</span></li>`).join('')}</ul>
  <i>ENTER TRACK →</i>`;

// 倒數（從計時塔借來的）
const pad = n => String(n).padStart(2, '0');
function tick() {
  const c = countdown();
  document.getElementById('digits').innerHTML =
    [[c.d, 'DAYS'], [c.h, 'HRS'], [c.m, 'MIN'], [c.s, 'SEC']]
      .map(([v, k]) => `<div class="dg"><b>${pad(v)}</b><span>${k}</span></div>`).join('');
}
tick();
setInterval(tick, 1000);

const st = document.getElementById('sticker');
st.innerHTML = `<small>NEXT RACE · R${next.no}</small>
  <strong>${next.en}</strong>
  <span>${next.flag} ${next.circuit} ・ ${next.dot}</span>
  <em>${next.live ? 'ENTER →' : 'COMING SOON'}</em>`;
if (next.live) st.href = `./${next.track}.html`;

document.getElementById('rows').innerHTML = rounds.map(r => {
  const cls = ['row', r.done ? 'done' : '', r.live ? 'live' : 'pend', r.isNext ? 'next' : ''].join(' ');
  const tag = r.live ? 'a' : 'div';
  const href = r.live ? ` href="./${r.track}.html"` : '';
  const thumb = r.live ? `<svg viewBox="0 0 100 100"><path d="${OUTLINES[r.track]}"/></svg>` : '';
  const win = RESULTS[r.r] && RESULTS[r.r][0];
  const go = r.live ? 'ENTER →' : win ? `P1 ${win.code} ・ 3D 建置中` : r.isNext ? 'NEXT' : '';
  return `<${tag}${href} class="${cls}">
    <span class="no">${r.no}</span>
    <span class="nm"><b>${r.en}</b><i>${r.flag} ${r.gp}</i></span>
    <span class="ci">${r.circuit}</span>
    <span class="dt">${r.dot}</span>
    <span class="th">${thumb}</span>
    <span class="go">${go}</span>
  </${tag}>`;
}).join('');

// ---- 名次：每站前三名上台，前 10 名可展開 ----
document.getElementById('res-sub').textContent =
  `已跑完的 ${Object.keys(RESULTS).length} 站，最新的在最前面。點「完整名次」看前 10 名。資料 ${UPDATED} 更新。`;

const byR = Object.fromEntries(rounds.map(r => [r.r, r]));
document.getElementById('cards').innerHTML = Object.keys(RESULTS).map(Number).sort((a, b) => b - a)
  .map(n => {
    const r = byR[n], res = RESULTS[n];
    const pod = res.slice(0, 3).map(x => `<li class="p${x.p}">
        <span class="pos">P${x.p}</span><b>${x.code}<small>#${x.no}</small></b>
        <span class="who">${x.name}<i>${x.team}</i></span>
      </li>`).join('');
    const rest = res.slice(3).map(x => `<tr><td>P${x.p}</td><td><b>${x.code}</b> #${x.no} ${x.name}</td>
        <td>${x.team}</td><td>${x.time}</td></tr>`).join('');
    return `<article class="card${r.live ? ' has' : ''}">
      <header><span class="n">R${r.no}</span><span>${r.flag} ${r.en}</span><span class="d">${r.dot}</span></header>
      <ol>${pod}</ol>
      <details><summary>完整名次</summary><table>${rest}</table></details>
      ${r.live ? `<a class="lk" href="./${r.track}.html">ENTER TRACK →</a>` : ''}
    </article>`;
  }).join('');
// ---- 積分榜：車手（含車號）／車隊 ----
document.getElementById('std-sub').textContent =
  `第 ${STANDINGS.round} 站後的累計積分（每站前 10 名計分）。資料 ${UPDATED} 更新。`;
const tbl = document.getElementById('tbl');
// 車隊識別標：自繪的三字母色塊，不使用官方 logo（商標）。key 是 API 的車隊名。
const MARK = {
  'Mercedes': ['MER', '#00A19B', '#fff'], 'Ferrari': ['FER', '#DC0000', '#fff'],
  'McLaren': ['MCL', '#FF8000', '#0D0D0D'], 'Red Bull': ['RBR', '#1E2F8F', '#fff'],
  'RB F1 Team': ['RB', '#5B7CFF', '#fff'], 'Alpine F1 Team': ['ALP', '#FF87BC', '#0D0D0D'],
  'Haas F1 Team': ['HAA', '#E6E6E6', '#0D0D0D'], 'Audi': ['AUD', '#5A5A5A', '#fff'],
  'Williams': ['WIL', '#0A6CFF', '#fff'], 'Aston Martin': ['AMR', '#00665A', '#fff'],
  'Cadillac F1 Team': ['CAD', '#0D0D0D', '#FFD60A'],
};
const mark = t => { const [c, bg, fg] = MARK[t] || [t.slice(0, 3).toUpperCase(), '#ccc', '#0D0D0D'];
  return `<span class="mk" style="background:${bg};color:${fg}">${c}</span>`; };
function showStd(kind) {
  const d = kind === 'd';
  const list = d ? STANDINGS.drivers : STANDINGS.teams;
  tbl.className = 'tbl' + (d ? '' : ' teams');
  tbl.style.setProperty('--rows', Math.ceil(list.length / 2));   // 由上往下排滿左欄，再排右欄
  tbl.innerHTML = list.map(x => `<li class="${x.p === 1 ? 'lead' : ''}">
      <span class="ps">${x.p}</span>
      ${d ? `<span class="no">${x.no}</span>` : ''}
      ${mark(x.team)}
      <span class="who">${d ? x.name : x.team}<i>${d ? x.team + ' ・ ' + x.code : x.wins + ' 勝'}</i></span>
      <span class="pt">${x.pts}<small>PTS</small></span></li>`).join('');
  document.getElementById('t-d').setAttribute('aria-selected', d);
  document.getElementById('t-t').setAttribute('aria-selected', !d);
}
document.getElementById('t-d').onclick = () => showStd('d');
document.getElementById('t-t').onclick = () => showStd('t');
showStd('d');
</script>
</body>
