# 每天自動更新賽程、名次、車手與車隊積分榜（Jolpica F1 API），在 GitHub 雲端跑。
# 只用 Python 標準庫。排在台灣時間每天 09:00，涵蓋歐美各站賽後。
name: 每日更新賽果

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # 台灣時間 09:00（GitHub 排程可能延遲數十分鐘）

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 更新賽程
        run: python make_calendar.py
      - name: 更新名次與積分榜
        run: python fetch_results.py
      - name: 有變動才提交
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.js tracks/results.js tracks/standings.js
          # 只有「更新時間」變動不算數，避免每天空提交
          if git diff --cached -U0 | grep '^[+-]' | grep -v '^+++\|^---' | grep -v '更新$' | grep -v 'UPDATED' | grep -q .; then
            git commit -m "每日更新 $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "沒有實質變動，不提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # 內建權杖推送的提交不會自動觸發其他流程，要明確叫發布流程起來
      - name: 觸發發布
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
