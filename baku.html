<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賽道解剖 — 亞塞拜然</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=5">
</head>
<body data-track="baku">
<div id="stage"></div>

<div id="panel">
  <div>
    <div class="eyebrow" id="eyebrow">Circuit Anatomy</div>
    <h1><span id="title">—</span><small id="subtitle"></small></h1>
  </div>

  <div class="facts" id="facts"></div>
  <div class="cards" id="cards"></div>

  <div class="tools">
    <div class="legend" id="legend"></div>
    <div class="row" id="exag-row">
      <span>高程放大</span>
      <input type="range" id="exag" min="1" max="8" step="0.5" value="5">
      <b id="exag-v">×5</b>
    </div>
    <div class="row">
      <span>圈上位置</span>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0">
    </div>
    <div class="row" style="gap:8px">
      <button class="btn" id="play">車載視角</button>
      <button class="btn" id="reset">全景</button>
      <a class="btn link" id="other" href="#"></a>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</div>

<div id="profile"><div class="cap" id="prof-cap">高程剖面</div><svg id="prof-svg"></svg></div>
<div id="hud">
  <svg id="map" viewBox="0 0 100 100"></svg>
  <div id="where"><b id="where-n"></b><span id="where-s"></span></div>
  <div id="next-turn"></div>
  <div id="readout"><b id="hud-a">—</b><span id="hud-b"></span></div>
</div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}
</script>
<script type="module" src="./app.js?v=3"></script>
</body>
</html>
